            - generic [ref=f67e751]:
              - main [ref=f67e756]:
                - article "OAuth inbound" [ref=f67e757]:
                  - generic [ref=f67e758]:
                    - generic [ref=f67e759]: Updated July 31, 2025
                    - generic [ref=f67e760]: 4 minutes to read
                  - group [ref=f67e762]:
                    - generic "Summarize" [ref=f67e763] [cursor=pointer]
                  - generic [ref=f67e769]:
                    - paragraph [ref=f67e770]: OAuth Inbound authentication allows trusted external applications to securely access ServiceNow APIs, ensuring controlled and authorized connections.
                    - generic [ref=f67e771]:
                      - text: "You must have one of the following roles to configure or manage OAuth integrations in the system:"
                      - list [ref=f67e772]:
                        - listitem [ref=f67e773]: oauth_admin
                        - listitem [ref=f67e774]: mi_admin
                        - listitem [ref=f67e775]: admin
                    - paragraph [ref=f67e776]: "Inbound authentication enables external applications such as third-party systems or other ServiceNow® instances to connect securely to ServiceNow APIs. Inbound authentication confirms that only trusted clients can access your ServiceNow instance in a controlled and secure manner. ServiceNow supports several OAuth 2.0 grant types, each designed for specific integration scenarios. Use the following information to choose the grant type that best fits your use case:"
                    - generic [ref=f67e777]:
                      - heading "Authorization Code Grant" [level=2] [ref=f67e778]
                      - table [ref=f67e779]:
                        - caption
                        - rowgroup [ref=f67e783]:
                          - row [ref=f67e784]:
                            - columnheader "Ideal usage scenario" [ref=f67e785]
                            - columnheader "Functionality" [ref=f67e786]
                        - rowgroup [ref=f67e787]:
                          - row [ref=f67e788]:
                            - cell [ref=f67e789]:
                              - text: Applications that must access user data on behalf of user with the user’s consent.
                              - paragraph [ref=f67e790]: "Example: Web, mobile, or desktop applications acting on behalf of a user."
                            - cell [ref=f67e791]:
                              - text: The user initiates the login process from the client application, which redirects them to a ServiceNow login page. After the user logs in and grants consent, the client application receives an authorization code. The client application exchanges the authorization code with the ServiceNow instance for an access token.
                              - paragraph [ref=f67e792]: Authorization code grant is the most secure and widely used workflow for user-facing integrations. It supports both confidential clients (with a client secret) and public clients using Proof Key for Code Exchange (PKCE).
                      - paragraph [ref=f67e793]: For more information about Authorization code grant workflow and configuration, see
                    - generic [ref=f67e794]:
                      - heading "Client Credentials Grant" [level=2] [ref=f67e795]
                      - table [ref=f67e796]:
                        - caption
                        - rowgroup [ref=f67e800]:
                          - row [ref=f67e801]:
                            - columnheader "Ideal Usage Scenario" [ref=f67e802]
                            - columnheader "Functionality" [ref=f67e803]
                        - rowgroup [ref=f67e804]:
                          - row [ref=f67e805]:
                            - cell "Client applications such as back-end services or automated system integrations that must access ServiceNow APIs without user involvement." [ref=f67e806]
                            - cell "The client application authenticates directly with the ServiceNow instance using its own credentials (client ID and secret). Once authenticated, the application receives an access token to access the ServiceNow APIs." [ref=f67e807]
                      - paragraph [ref=f67e808]: For more information about Client credentials grant workflow and configuration, see .
                    - generic [ref=f67e809]:
                      - heading "Third party ID Token Flow" [level=2] [ref=f67e810]
                      - table [ref=f67e811]:
                        - caption
                        - rowgroup [ref=f67e815]:
                          - row [ref=f67e816]:
                            - columnheader "Ideal Usage Scenario" [ref=f67e817]
                            - columnheader "Functionality" [ref=f67e818]
                        - rowgroup [ref=f67e819]:
                          - row [ref=f67e820]:
                            - cell "Federated authentication scenarios where ServiceNow trusts identity or access tokens issued by external identity providers such as Azure AD or Okta." [ref=f67e821]
                            - cell "The client application obtains an ID or access token from a trusted third-party identity provider, and includes it in the authorization header when making API requests to the ServiceNow instance. ServiceNow validates the token and, if trusted, grants access based on the identity it asserts. This enables seamless single sign-on (SSO) and federated authentication across systems." [ref=f67e822]
                      - paragraph [ref=f67e823]: For more information about Third party token flow and configuration, see.
                    - generic [ref=f67e824]:
                      - heading "JWT Bearer Grant" [level=2] [ref=f67e825]
                      - table [ref=f67e826]:
                        - caption
                        - rowgroup [ref=f67e830]:
                          - row [ref=f67e831]:
                            - columnheader "Ideal Usage Scenario" [ref=f67e832]
                            - columnheader "Functionality" [ref=f67e833]
                        - rowgroup [ref=f67e834]:
                          - row [ref=f67e835]:
                            - cell [ref=f67e836]:
                              - text: Client applications that need secure access to ServiceNow resources, either on behalf of a user or as themselves, without requiring user interaction or storing a shared secret.
                              - paragraph [ref=f67e837]: The client application creates a signed JSON Web Token (JWT) that includes identity-related claims, such as the user or system it represents. It then presents it to the ServiceNow instance to request for access token.
                            - cell [ref=f67e838]:
                              - generic [ref=f67e839]:
                                - term [ref=f67e840]: "When acting on behalf of a user:"
                                - definition [ref=f67e841]: The token represents a previously authenticated user. This enables secure, seamless access without prompting the user for credentials or consent again. The signed token asserts the user’s identity, enabling ServiceNow to trust the request without requiring real-time user interaction.
                                - term [ref=f67e842]: "When acting as itself:"
                                - definition [ref=f67e843]: The token identifies and authenticates the client application directly. Instead of using a shared secret, the client signs the token with a private key, making it a more secure alternative to the client credentials grant.
                      - paragraph [ref=f67e844]: For more information about JWT bearer grant workflow and configuration, see .
                    - generic [ref=f67e845]:
                      - heading "Resource Owner Password Credentials Grant" [level=2] [ref=f67e846]
                      - table [ref=f67e847]:
                        - caption
                        - rowgroup [ref=f67e851]:
                          - row [ref=f67e852]:
                            - columnheader "Ideal Usage Scenario" [ref=f67e853]
                            - columnheader "Functionality" [ref=f67e854]
                        - rowgroup [ref=f67e855]:
                          - row [ref=f67e856]:
                            - cell "Highly trusted internal client applications in controlled environments where the app collects the user’s credentials directly." [ref=f67e857]
                            - cell "The client application collects the user’s user name and password, and redirects them to the ServiceNow instance to obtain an access token. The workflow bypasses redirection and consent screens, but exposes user credentials to the client application. ServiceNow recommends that you implement the Resource owner password credentials grant only in legacy or controlled environments." [ref=f67e858]
                      - paragraph [ref=f67e859]:
                        - text: For more information about Resource owner password credentials grant workflow and configuration, see
                        - link "Resource owner password credential grant" [ref=f67e860] [cursor=pointer]:
                          - /url: https://www.servicenow.com/docs/r/oJu9n0q6rU~F9UHAnNCt5w/DCo54ZriiS80_dzln64P5w
                        - text: .
                    - generic [ref=f67e861]:
                      - heading "Implicit Grants" [level=2] [ref=f67e862]
                      - table [ref=f67e863]:
                        - caption
                        - rowgroup [ref=f67e867]:
                          - row [ref=f67e868]:
                            - columnheader "Ideal Usage Scenario" [ref=f67e869]
                            - columnheader "Functionality" [ref=f67e870]
                        - rowgroup [ref=f67e871]:
                          - row [ref=f67e872]:
                            - cell "Legacy Single-page applications (SPAs) or browser-based apps that can’t securely store a client secret, and require a lightweight, client-side authentication flow." [ref=f67e873]
                            - cell [ref=f67e874]:
                              - text: The user logs in through a browser. The client application receives the access token directly in the URL after login, bypassing the intermediate authorization code step.
                              - paragraph [ref=f67e875]: This flow was originally designed for public clients that run entirely in the browser, where securely storing secrets isn’t possible. While it simplifies implementation, it exposes tokens in the browser, increasing the risk of interception. For stronger security, ServiceNow recommends implementing an authorization code grant with PKCE.
                      - paragraph [ref=f67e876]:
                        - text: For more information about Implicit grant workflow and configuration, see
                        - link "OAuth implicit grants" [ref=f67e877] [cursor=pointer]:
                          - /url: https://www.servicenow.com/docs/r/oJu9n0q6rU~F9UHAnNCt5w/70Df8WnzGVV7N7C_75fI8g
                        - text: .
                    - generic [ref=f67e878]:
                      - heading "OAuth Scopes" [level=2] [ref=f67e879]
                      - paragraph [ref=f67e880]:
                        - text: You can scope the OAuth authentication scope support for REST API. OAuth Scope provides access to only the particular REST APIs. For more information, see
                        - link "REST API Auth Scope" [ref=f67e881] [cursor=pointer]:
